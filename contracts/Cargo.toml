[workspace]
resolver = "2"
members = [
    "amm",
    "blend-adapter",
    "pt-token",
    "sy-wrapper",
    "shared/types",
    "tokenizer",
    "yt-token",
    "integration_tests",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "Apache-2.0"
repository = "https://github.com/Novaire-tech/novaire-testnet"

[workspace.dependencies]
soroban-sdk = { version = "=27.0.6", default-features = false }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
